# Check prettier and run build on PRs

name: PR Checks

on:
  pull_request:
    branches:
      - main

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install dependencies
        run: yarn install

      - name: Run prettier
        run: yarn run prettier --check .

      - name: Run build
        run: yarn build
